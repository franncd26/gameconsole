name: GameConsole CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: Build Compose and run one authentic SDK integration
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install SWI-Prolog
        run: sudo apt-get update && sudo apt-get install -y swi-prolog-nox
      - name: Syntax checks
        run: npm run check
      - name: Historical, SDK, Bridge, console and deployment unit tests
        run: npm test
      - name: Exhaustive packaged Prolog strategy tests
        run: swipl -q -s plugins/tic-tac-toe/prolog/gato_tests.pl -g run_tests -t halt
  integrated:
    needs: verify
    # Missing input also enables integration for manual dispatch from the existing workflow UI.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.integration != 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: gameconsole-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare pinned GameStats source
        run: node scripts/prepare.mjs
      - name: Verify exact source ref
        run: test "$(git -C .deps/gamestats rev-parse HEAD)" = "$(node -p 'JSON.parse(require("fs").readFileSync("gamestats.lock.json")).ref')"
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build the three images
        run: docker compose build
      - name: Start and wait for healthy services
        run: docker compose up -d --wait --wait-timeout 180
      - name: SDK catalog, real Prolog and Go-to-Scala integration (one run)
        run: npm run test:integration:sdk
      - name: Diagnostics
        if: failure()
        run: |
          mkdir -p evidence
          docker compose logs --no-color --tail=100 > evidence/compose-failure.log 2>&1
      - name: Save integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/sdk-integration.json
            evidence/compose-failure.log
          if-no-files-found: warn
      - name: Stop test deployment
        if: always()
        run: docker compose down
