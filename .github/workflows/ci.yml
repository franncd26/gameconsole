name: GameConsole CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install SWI-Prolog
        run: sudo apt-get update && sudo apt-get install -y swi-prolog-nox
      - name: Game and HTTP tests
        run: npm test
      - name: Exhaustive Prolog strategy tests
        run: swipl -q -s prolog/gato_tests.pl -g run_tests -t halt
      - name: Syntax checks
        run: npm run check
      - name: Prepare pinned GameStats source
        run: node scripts/prepare.mjs
      - name: Build and deploy integrated environment
        run: docker compose up -d --build --wait
      - name: Six concurrent matches against real services
        run: npm run test:integration
      - name: Save integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence
          path: evidence/
          if-no-files-found: warn
      - name: Diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop test deployment
        if: always()
        run: docker compose down
