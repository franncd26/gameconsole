<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gato · GameConsole</title><link rel="stylesheet" href="./styles.css"><script type="module" src="./app.mjs"></script></head>
<body><header><h1>Gato</h1><span id="connection" class="badge" role="status">Sin conexión</span></header>
<main class="layout"><section id="track" class="stage" aria-label="Área de juego"><div class="board" role="group" aria-label="Tablero de Gato"><button class="cell" data-cell="0" aria-label="Casilla 1: vacía" disabled></button><button class="cell" data-cell="1" aria-label="Casilla 2: vacía" disabled></button><button class="cell" data-cell="2" aria-label="Casilla 3: vacía" disabled></button><button class="cell" data-cell="3" aria-label="Casilla 4: vacía" disabled></button><button class="cell" data-cell="4" aria-label="Casilla 5: vacía" disabled></button><button class="cell" data-cell="5" aria-label="Casilla 6: vacía" disabled></button><button class="cell" data-cell="6" aria-label="Casilla 7: vacía" disabled></button><button class="cell" data-cell="7" aria-label="Casilla 8: vacía" disabled></button><button class="cell" data-cell="8" aria-label="Casilla 9: vacía" disabled></button></div></section><section class="panel" aria-label="Estado y controles"><h2 id="turn-label">Preparando tablero</h2><div class="stats"><span>Dificultad<strong id="difficulty">—</strong></span><span>Movimientos<strong id="turn">0</strong></span></div><p class="instructions">Tú eres X. Selecciona una casilla con el ratón o Tab + Enter. Prolog juega con O.</p><button id="retry-ai" hidden>Reintentar IA</button><p id="result" class="result" role="status"></p><p id="note" class="notice" role="status" aria-live="polite">Esperando conexión…</p><details class="diagnostics"><summary>Ayuda y recuperación</summary><div class="tools"><button id="sync">Consultar estado</button><button id="replay" hidden>Recuperar misma operación</button></div></details></section></main>
<details class="diagnostics"><summary>Detalles de la partida</summary><footer id="identity" class="identity">Esperando conexión</footer></details></body></html>
