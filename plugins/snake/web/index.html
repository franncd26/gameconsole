<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Snake · GameConsole</title><link rel="stylesheet" href="./styles.css"><script type="module" src="./app.mjs"></script></head>
<body><header><h1>Snake</h1><span id="connection" class="badge" role="status">Sin conexión</span></header>
<main class="layout"><section id="track" class="stage" aria-label="Área de juego"><canvas id="canvas" width="240" height="240" role="img" aria-label="Serpiente y manzana, tablero confirmado"></canvas></section><section class="panel" aria-label="Estado y controles"><div class="stats"><span>Puntos<strong id="points">0</strong></span><span>Cuadrícula<strong id="size">—</strong></span></div><p class="instructions">Flechas o WASD para girar. Cada movimiento se confirma en el servidor.</p><button id="start" class="primary">Jugar / continuar</button><div class="pad" role="group" aria-label="Dirección"><button data-direction="up" aria-label="Arriba">↑</button><button data-direction="left" aria-label="Izquierda">←</button><button data-direction="down" aria-label="Abajo">↓</button><button data-direction="right" aria-label="Derecha">→</button></div><p id="result" class="result" role="status"></p><p id="note" class="notice" role="status" aria-live="polite">Esperando conexión…</p><div class="tools"><button id="sync">Consultar estado</button><button id="replay" hidden>Recuperar misma operación</button></div></section></main>
<footer id="identity" class="identity">Esperando INIT</footer></body></html>
