<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Circuito · GameConsole</title><link rel="stylesheet" href="./styles.css"><script type="module" src="./app.mjs"></script></head>
<body><header><h1>Circuito</h1><span id="connection" class="badge" role="status">Sin conexión</span></header>
<main class="layout"><section id="track" class="stage" aria-label="Área de juego"><canvas id="canvas" width="300" height="240" role="img" aria-label="Pista de tres carriles, vehículo y obstáculos confirmados"></canvas></section><section class="panel" aria-label="Estado y controles"><div class="stats"><span>Velocidad<strong id="speed">0</strong></span><span>Vueltas completas<strong id="laps">0 / 3</strong></span><span>Choques<strong id="collisions">0</strong></span></div><p id="times">Sin vueltas completadas</p><p class="instructions">← → o A/D: carril. Mantén ↑/W para acelerar; ↓/S para frenar.</p><button id="start" class="primary">Jugar</button><div class="controls" role="group" aria-label="Controles de conducción"><button data-lane="-1" aria-label="Carril izquierdo">←</button><button data-lane="1" aria-label="Carril derecho">→</button><button data-pedal="accelerate" aria-pressed="false">Acelerar</button><button data-pedal="brake" aria-pressed="false">Frenar</button></div><p id="result" class="result" role="status"></p><p id="note" class="notice" role="status" aria-live="polite">Esperando conexión…</p><details class="diagnostics"><summary>Ayuda y recuperación</summary><div class="tools"><button id="sync">Consultar estado</button><button id="replay" hidden>Recuperar misma operación</button></div></details></section></main>
<details class="diagnostics"><summary>Detalles de la partida</summary><footer id="identity" class="identity">Esperando conexión</footer></details></body></html>
